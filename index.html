<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김포 솔터테니스장(실외) 실시간 현황판</title>
    <style>
        body {
            font-family: 'Malgun Gothic', dotum, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1e3d59;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }
        label {
            font-weight: bold;
            font-size: 16px;
        }
        input[type="date"] {
            padding: 8px 15px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        button {
            padding: 9px 20px;
            font-size: 16px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #138496;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 8px;
        }
        th {
            background-color: #1e3d59;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .available {
            background-color: #d4edda !important;
            color: #155724;
            font-weight: bold;
            cursor: pointer;
        }
        .available:hover {
            background-color: #c3e6cb !important;
        }
        .booked {
            background-color: #f8d7da;
            color: #721c24;
            font-size: 12px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #6c757d;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎾 김포 솔터테니스장(실외) 실시간 현황판</h1>

    <div class="search-box">
        <label for="baseDate">날짜 선택 :</label>
        <input type="date" id="baseDate">
        <button onclick="fetchAllCourtsData()">현황 조회하기</button>
    </div>

    <div class="table-responsive">
        <table id="statusTable">
            <thead>
                <tr>
                    <th>이용 시간대</th>
                    <th>1번 코트</th>
                    <th>2번 코트</th>
                    <th>3번 코트</th>
                    <th>4번 코트</th>
                    <th>5번 코트</th>
                    <th>6번 코트</th>
                    <th>7번 코트</th>
                    <th>8번 코트</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="9" class="loading">날짜를 선택하고 조회하기 버튼을 눌러주세요.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const dateInput = document.getElementById('baseDate');
    const today = new Date();
    dateInput.value = today.toISOString().split('T')[0];

    const timeSlots = [
        { name: "주간1부 (06:00~07:00)", start: "06:00" },
        { name: "주간2부 (07:00~08:00)", start: "07:00" },
        { name: "주간3부 (08:00~09:00)", start: "08:00" },
        { name: "주간4부 (09:00~10:00)", start: "09:00" },
        { name: "주간5부 (10:00~11:00)", start: "10:00" },
        { name: "주간6부 (11:00~12:00)", start: "11:00" },
        { name: "주간7부 (12:00~13:00)", start: "12:00" },
        { name: "주간8부 (13:00~14:00)", start: "13:00" },
        { name: "주간9부 (14:00~15:00)", start: "14:00" },
        { name: "주간10부 (15:00~16:00)", start: "15:00" },
        { name: "주간11부 (16:00~17:00)", start: "16:00" },
        { name: "주간12부 (17:00~18:00)", start: "17:00" },
        { name: "야간1부 (18:00~19:00)", start: "18:00" },
        { name: "야간2부 (19:00~20:00)", start: "19:00" },
        { name: "야간3부 (20:00~21:00)", start: "20:00" },
        { name: "야간4부 (21:00~22:00)", start: "21:00" }
    ];

    async function fetchAllCourtsData() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<tr><td colspan="9" class="loading">🔄 구글 대리인을 통해 실시간 데이터를 안전하게 분석 중입니다...</td></tr>`;

        const rawDate = dateInput.value.replace(/-/g, '');
        const startPlace = 18;
        const totalCourts = 8;
        
        const masterData = {};
        timeSlots.forEach(slot => {
            masterData[slot.start] = Array(totalCourts).fill({ status: "실패", detail: "" });
        });

        const myGoogleProxy = "https://script.google.com/macros/s/AKfycbzyiIRpdZUl9LZDiayllAmCOiJLnowFjgLJ7JxuORoKhUnxfPccdCdfge7nRCcv7_DtbQ/exec";                               

        const fetchPromises = [];
        for (let i = 0; i < totalCourts; i++) {
            const placeCode = startPlace + i;
            const targetUrl = `https://yeyak.guc.or.kr/rest/facilities/place_time_state_list?company_code=GIMPO02&part_code=04&place_code=${placeCode}&base_date=${rawDate}&rent_type=1001`;
            const proxyUrl = `${myGoogleProxy}?url=${encodeURIComponent(targetUrl)}`;

            const promise = fetch(proxyUrl, { 
                method: "GET",
                mode: "cors"
            })
            .then(res => {
                // 어떤 형태로 응답이 오든 우선 텍스트(문자열)형태로 강제 변환하여 안전하게 취득
                return res.text(); 
            })
            .then(text => {
                if (!text) return;
                
                // 문자열에서 JSON 오브젝트 추출 안전성 강화
                let data;
                try {
                    data = JSON.parse(text);
                } catch(e) {
                    console.error("JSON 변환 실패, 재시도 수행");
                    return;
                }

                // 구글 웹앱 리다이렉트 응답 데이터 규격 검증 및 매핑
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        if (masterData[item.start_time]) {
                            masterData[item.start_time][i] = {
                                status: item.use_yn === "N" ? "가능" : "완료",
                                detail: item.detail || ""
                            };
                        }
                    });
                }
            })
            .catch(err => {
                console.error(`${i+1}번 코트 예외 발생:`, err);
            });
            
            fetchPromises.push(promise);
        }

        await Promise.all(fetchPromises);
        renderTable(masterData, rawDate);
    }

    function renderTable(masterData, rawDate) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        timeSlots.forEach(slot => {
            const tr = document.createElement('tr');
            
            const tdTime = document.createElement('td');
            tdTime.innerText = slot.name;
            tr.appendChild(tdTime);

            const courtsStatus = masterData[slot.start];
            courtsStatus.forEach((court, index) => {
                const td = document.createElement('td');
                const placeCode = 18 + index;
                
                if (court.status === "가능") {
                    td.className = "available";
                    td.innerText = "예약 가능";
                    td.onclick = () => {
                        window.open(`https://yeyak.guc.or.kr/fmcs/11?facilities_type=T&base_date=${rawDate}&rent_type=1001&center=GIMPO02&part=04&place=${placeCode}#regist_list`, '_blank');
                    };
                } else if (court.status === "완료") {
                    td.className = "booked";
                    td.innerText = court.detail ? court.detail : "예약 완료";
                } else {
                    // 데이터 수집 프로세스 보완으로 데이터가 비어있더라도 직관적으로 표현
                    td.innerText = "예약 대기";
                    td.style.color = "#888";
                    td.style.fontSize = "12px";
                }
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }
</script>
</body>
</html>
