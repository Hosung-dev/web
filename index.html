<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김포 솔터테니스장(실외) 실시간 현황판</title>
    <style>
        body {
            font-family: 'Malgun Gothic', dotum, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1e3d59;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }
        .guide-box {
            background-color: #e8f4fd;
            border-left: 4px solid #2196f3;
            padding: 12px 20px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
        }
        label {
            font-weight: bold;
            font-size: 16px;
        }
        input[type="date"] {
            padding: 8px 15px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        button {
            padding: 9px 20px;
            font-size: 16px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #138496;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 8px;
        }
        th {
            background-color: #1e3d59;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .available {
            background-color: #d4edda !important;
            color: #155724;
            font-weight: bold;
            cursor: pointer;
        }
        .available:hover {
            background-color: #c3e6cb !important;
        }
        .booked {
            background-color: #f8d7da;
            color: #721c24;
            font-size: 12px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #6c757d;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎾 김포 솔터테니스장(실외) 실시간 현황판</h1>
    
    <div class="guide-box">
        💡 <b>최초 사용 시 필수 확인:</b> 데이터 조회가 안 되고 먹통이 될 경우, 브라우저에 CORS 해제 확장 프로그램(예: <b>Allow CORS</b>)이 켜져 있는지 확인해 주세요. 공식 홈페이지에서 데이터를 직접 안전하게 긁어오기 위해 꼭 필요합니다.
    </div>

    <div class="search-box">
        <label for="baseDate">날짜 선택 :</label>
        <input type="date" id="baseDate">
        <button onclick="fetchAllCourtsData()">현황 조회하기</button>
    </div>

    <div class="table-responsive">
        <table id="statusTable">
            <thead>
                <tr>
                    <th>이용 시간대</th>
                    <th>1번 코트</th>
                    <th>2번 코트</th>
                    <th>3번 코트</th>
                    <th>4번 코트</th>
                    <th>5번 코트</th>
                    <th>6번 코트</th>
                    <th>7번 코트</th>
                    <th>8번 코트</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="9" class="loading">날짜를 선택하고 조회하기 버튼을 눌러주세요.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 오늘 날짜 기본값 지정
    const dateInput = document.getElementById('baseDate');
    const today = new Date();
    dateInput.value = today.toISOString().split('T')[0];

    const timeSlots = [
        { name: "주간1부 (06:00~07:00)", start: "06:00" },
        { name: "주간2부 (07:00~08:00)", start: "07:00" },
        { name: "주간3부 (08:00~09:00)", start: "08:00" },
        { name: "주간4부 (09:00~10:00)", start: "09:00" },
        { name: "주간5부 (10:00~11:00)", start: "10:00" },
        { name: "주간6부 (11:00~12:00)", start: "11:00" },
        { name: "주간7부 (12:00~13:00)", start: "12:00" },
        { name: "주간8부 (13:00~14:00)", start: "13:00" },
        { name: "주간9부 (14:00~15:00)", start: "14:00" },
        { name: "주간10부 (15:00~16:00)", start: "15:00" },
        { name: "주간11부 (16:00~17:00)", start: "16:00" },
        { name: "주간12부 (17:00~18:00)", start: "17:00" },
        { name: "야간1부 (18:00~19:00)", start: "18:00" },
        { name: "야간2부 (19:00~20:00)", start: "19:00" },
        { name: "야간3부 (20:00~21:00)", start: "20:00" },
        { name: "야간4부 (21:00~22:00)", start: "21:00" }
    ];

    async function fetchAllCourtsData() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<tr><td colspan="9" class="loading">🔄 8개 코트 정보를 실시간으로 가져오는 중입니다...</td></tr>`;

        const rawDate = dateInput.value.replace(/-/g, '');
        const startPlace = 18;
        const totalCourts = 8;
        
        const masterData = {};
        timeSlots.forEach(slot => {
            masterData[slot.start] = Array(totalCourts).fill({ status: "실패", detail: "" });
        });

        const fetchPromises = [];
        for (let i = 0; i < totalCourts; i++) {
            const placeCode = startPlace + i;
            
            // 프록시 없이 다이렉트 주소로 요청 변경
            const targetUrl = `https://yeyak.guc.or.kr/rest/facilities/place_time_state_list?company_code=GIMPO02&part_code=04&place_code=${placeCode}&base_date=${rawDate}&rent_type=1001`;

            const promise = fetch(targetUrl)
                .then(res => {
                    if (!res.ok) throw new Error("CORS 또는 서버 오류");
                    return res.json();
                })
                .then(data => {
                    if (Array.isArray(data)) {
                        data.forEach(item => {
                            if (masterData[item.start_time]) {
                                masterData[item.start_time][i] = {
                                    status: item.use_yn === "N" ? "가능" : "완료",
                                    detail: item.detail || ""
                                };
                            }
                        });
                    }
                })
                .catch(err => {
                    console.error(`${i+1}번 코트 데이터 로드 실패`, err);
                });
            
            fetchPromises.push(promise);
        }

        await Promise.all(fetchPromises);
        renderTable(masterData, rawDate);
    }

    function renderTable(masterData, rawDate) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        // 가져온 데이터가 모두 실패일 경우 경고 문구 출력
        let totalFailCount = 0;

        timeSlots.forEach(slot => {
            const tr = document.createElement('tr');
            const tdTime = document.createElement('td');
            tdTime.innerText = slot.name;
            tr.appendChild(tdTime);

            const courtsStatus = masterData[slot.start];
            courtsStatus.forEach((court, index) => {
                const td = document.createElement('td');
                const placeCode = 18 + index;
                
                if (court.status === "가능") {
                    td.className = "available";
                    td.innerText = "예약 가능";
                    td.onclick = () => {
                        window.open(`https://yeyak.guc.or.kr/fmcs/11?facilities_type=T&base_date=${rawDate}&rent_type=1001&center=GIMPO02&part=04&place=${placeCode}#regist_list`, '_blank');
                    };
                } else if (court.status === "완료") {
                    td.className = "booked";
                    td.innerText = court.detail ? court.detail : "예약 완료";
                } else {
                    td.innerText = "데이터 오류";
                    td.style.color = "#ff6b6b";
                    totalFailCount++;
                }
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });

        // 8개 코트 전체 행렬이 다 실패했을 때 안내 메시지
        if (totalFailCount >= (timeSlots.length * 8)) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="9" style="padding:30px; color:#e74c3c; font-weight:bold; font-size:16px;">
                        ⚠️ 브라우저 보안(CORS) 제한으로 데이터를 가져오지 못했습니다.<br>
                        크롬 확장 프로그램 'Allow CORS'를 설치하고 상단 아이콘을 눌러 [활성화] 한 뒤 다시 조회해 주세요!
                    </td>
                </tr>`;
        }
    }
</script>
</body>
</html>
