<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테니스장 통합 예약현황판</title>
    <style>
        body {
            font-family: 'Malgun Gothic', dotum, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e9ecef;
            color: #495057;
            border: 2px solid #dee2e6;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: #1e3d59;
            color: white;
            border-color: #1e3d59;
        }
        .tab-btn:hover {
            background-color: #dee2e6;
        }
        .tab-btn.active:hover {
            background-color: #1e3d59;
        }

        h1 {
            text-align: center;
            color: #1e3d59;
            margin-bottom: 25px;
        }
        
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px; 
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }
        label {
            font-weight: bold;
            font-size: 16px;
        }
        input[type="date"] {
            padding: 8px 15px;
            font-size: 16px;
            border: 2px solid #777777;
            border-radius: 4px;
        }
        .search-btn {
            padding: 9px 20px;
            font-size: 16px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-btn:hover {
            background-color: #138496;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        
        th, td {
            border: 1px solid #555555;
            padding: 12px 8px;
        }
        th {
            background-color: #1e3d59;
            color: white;
            font-weight: bold;
        }
        th.section-header {
            background-color: #2b5876;
            font-size: 15px;
            letter-spacing: 1px;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        th.border-divider, td.border-divider {
            border-right: 3px solid #111111 !important;
        }

        .available {
            background-color: #d4edda !important;
            color: #155724;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .available:hover {
            background-color: #c3e6cb !important;
        }
        .booked {
            background-color: #f8d7da;
            color: #721c24;
            font-weight: bold;
            font-size: 15px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #6c757d;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchSite('solter')">솔터테니스장</button>
        <button class="tab-btn" onclick="switchSite('seoam')">서암생활체육공원</button>
        <button class="tab-btn" onclick="switchSite('parcos')">파르코스</button>
    </div>

    <h1 id="mainTitle">🎾 솔터테니스 예약현황판</h1>

    <div class="search-box">
        <label for="baseDate">날짜 선택 :</label>
        <input type="date" id="baseDate">
        <button class="search-btn" onclick="fetchActiveSiteData()">현황 조회하기</button>
    </div>

    <div class="table-responsive">
        <table id="statusTable">
            <thead id="tableHead">
                </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    const PROXY_SOLTER = "https://script.google.com/macros/s/AKfycbzyiIRpdZUl9LZDiayllAmCOiJLnowFjgLJ7JxuORoKhUnxfPccdCdfge7nRCcv7_DtbQ/exec";
    const PROXY_GIMPO = "https://urpinetreez.dothome.co.kr/proxy.php";

    const dateInput = document.getElementById('baseDate');
    dateInput.value = new Date().toLocaleDateString('sv-SE');

    const timeSlots = [
        { name: "주간1부 (06:00~07:00)", start: "06:00" },
        { name: "주간2부 (07:00~08:00)", start: "07:00" },
        { name: "주간3부 (08:00~09:00)", start: "08:00" },
        { name: "주간4부 (09:00~10:00)", start: "09:00" },
        { name: "주간5부 (10:00~11:00)", start: "10:00" },
        { name: "주간6부 (11:00~12:00)", start: "11:00" },
        { name: "주간7부 (12:00~13:00)", start: "12:00" },
        { name: "주간8부 (13:00~14:00)", start: "13:00" },
        { name: "주간9부 (14:00~15:00)", start: "14:00" },
        { name: "주간10부 (15:00~16:00)", start: "15:00" },
        { name: "주간11부 (16:00~17:00)", start: "16:00" },
        { name: "주간12부 (17:00~18:00)", start: "17:00" },
        { name: "야간1부 (18:00~19:00)", start: "18:00" },
        { name: "야간2부 (19:00~20:00)", start: "19:00" },
        { name: "야간3부 (20:00~21:00)", start: "20:00" },
        { name: "야간4부 (21:00~22:00)", start: "21:00" }
    ];

    let currentSite = 'solter';
    const siteConfig = {
        solter: {
            title: "🎾 솔터테니스 예약현황판",
            headers: `
                <tr>
                    <th rowspan="2">이용 시간대</th>
                    <th colspan="8" class="section-header border-divider">실외 코트</th>
                    <th colspan="4" class="section-header">실내 코트</th>
                </tr>
                <tr>
                    <th>1번</th><th>2번</th><th>3번</th><th>4번</th><th>5번</th><th>6번</th><th>7번</th><th class="border-divider">8번</th>
                    <th>A코트</th><th>B코트</th><th>C코트</th><th>D코트</th>
                </tr>
            `,
            colCount: 13,
            courts: [
                { label: "1번", code: 18, partCode: "04" }, { label: "2번", code: 19, partCode: "04" },
                { label: "3번", code: 20, partCode: "04" }, { label: "4번", code: 21, partCode: "04" },
                { label: "5번", code: 22, partCode: "04" }, { label: "6번", code: 23, partCode: "04" },
                { label: "7번", code: 24, partCode: "04" }, { label: "8번", code: 25, partCode: "04", isDivider: true },
                { label: "A코트", code: 34, partCode: "13" }, { label: "B코트", code: 35, partCode: "13" },
                { label: "C코트", code: 36, partCode: "13" }, { label: "D코트", code: 37, partCode: "13" }
            ]
        },
        seoam: {
            title: "🌿 서암생활체육공원 테니스 예약현황판",
            headers: `
                <tr>
                    <th rowspan="2">이용 시간대</th>
                    <th colspan="3" class="section-header">테니스 코트</th>
                </tr>
                <tr>
                    <th>1번 코트</th><th>2번 코트</th><th>3번 코트</th>
                </tr>
            `,
            colCount: 4,
            courts: [
                { label: "A관", sTeb: "b", url: "http://www.gimposports.or.kr/skin/orders/timeBoard.php" },
                { label: "B관", sTeb: "b", url: "http://www.gimposports.or.kr/skin/orders/timeBoard.php" },
                { label: "C관", sTeb: "b", url: "http://www.gimposports.or.kr/skin/orders/timeBoard.php" }
            ]
        },
        parcos: {
            title: "🏸 파르코스 테니스 예약현황판",
            headers: `
                <tr>
                    <th rowspan="2">이용 시간대</th>
                    <th colspan="8" class="section-header">파르코스 코트</th>
                </tr>
                <tr>
                    <th>1번 코트</th><th>2번 코트</th><th>3번 코트</th><th>4번 코트</th>
                    <th>5번 코트</th><th>6번 코트</th><th>7번 코트</th><th>8번 코트</th>
                </tr>
            `,
            colCount: 9,
            courts: [
                { label: "A관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" },
                { label: "B관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" },
                { label: "C관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" },
                { label: "D관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" },
                { label: "E관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" },
                { label: "F관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" },
                { label: "G관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" },
                { label: "H관", sTeb: "g", url: "http://www.gimposports.or.kr/skin/orders/timeBoard4.php" }
            ]
        }
    };

    function switchSite(siteKey) {
        currentSite = siteKey;
        document.querySelectorAll('.tab-menu .tab-btn').forEach(btn => btn.classList.remove('active'));
        
        const btns = document.querySelectorAll('.tab-menu .tab-btn');
        if(siteKey === 'solter') btns[0].classList.add('active');
        if(siteKey === 'seoam') btns[1].classList.add('active');
        if(siteKey === 'parcos') btns[2].classList.add('active');

        const config = siteConfig[currentSite];
        document.getElementById('mainTitle').innerText = config.title;
        document.getElementById('tableHead').innerHTML = config.headers;
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="${config.colCount}" class="loading">날짜를 선택하고 조회하기 버튼을 눌러주세요.</td></tr>`;
    }

    document.getElementById('tableHead').innerHTML = siteConfig[currentSite].headers;
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="${siteConfig[currentSite].colCount}" class="loading">날짜를 선택하고 조회하기 버튼을 눌러주세요.</td></tr>`;

    function fetchActiveSiteData() {
        if (currentSite === 'solter') {
            fetchSolterData();
        } else {
            fetchGimposportsData();
        }
    }

    async function fetchSolterData() {
        const config = siteConfig.solter;
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<tr><td colspan="${config.colCount}" class="loading">🔄 솔터테니스장 데이터를 로딩 중입니다...</td></tr>`;

        const rawDate = dateInput.value.replace(/-/g, '');
        const masterData = {};
        timeSlots.forEach(slot => { masterData[slot.start] = Array(config.courts.length).fill({ status: "실패" }); });

        const fetchPromises = config.courts.map((court, idx) => {
            const targetUrl = `https://yeyak.guc.or.kr/rest/facilities/place_time_state_list?company_code=GIMPO02&part_code=${court.partCode}&place_code=${court.code}&base_date=${rawDate}&rent_type=1001`;
            const finalUrl = `${PROXY_SOLTER}?url=${encodeURIComponent(targetUrl)}`;

            return fetch(finalUrl)
            .then(res => res.text())
            .then(text => {
                try {
                    let data = JSON.parse(text);
                    if (Array.isArray(data)) {
                        data.forEach(item => {
                            if (masterData[item.start_time]) {
                                masterData[item.start_time][idx] = {
                                    status: item.use_yn === "N" ? "가능" : "완료",
                                    url: `https://yeyak.guc.or.kr/fmcs/11?facilities_type=T&base_date=${rawDate}&rent_type=1001&center=GIMPO02&part=${court.partCode}&place=${court.code}#regist_list`
                                };
                            }
                        });
                    }
                } catch(e) {}
            }).catch(() => {});
        });

        await Promise.all(fetchPromises);
        renderTable(masterData);
    }

    async function fetchGimposportsData() {
        const config = siteConfig[currentSite];
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<tr><td colspan="${config.colCount}" class="loading">🔄 ${config.title.split(' ')[1]} 데이터를 정밀 분석 중입니다...</td></tr>`;

        const formattedDate = dateInput.value; 
        const masterData = {};
        timeSlots.forEach(slot => { masterData[slot.start] = Array(config.courts.length).fill({ status: "실패" }); });

        const fetchPromises = config.courts.map((court, idx) => {
            const targetUrl = `${court.url}?sTeb=${court.sTeb}&sRoom=${encodeURIComponent(court.label)}&orderDate=${formattedDate}&settingTimeSet=2`;
            const finalUrl = `${PROXY_GIMPO}?url=${encodeURIComponent(targetUrl)}`;

            return fetch(finalUrl)
            .then(res => res.text())
            .then(htmlText => {
                if (!htmlText || htmlText.includes("프록시 연결 에러")) return;

                // 🌟 [정규식 전면 전개수정] 유니코드 특수공백(\xa0) 및 지저분한 공백(\s*)을 전부 유연하게 대처하는 정규식
                const regex = /<label\s+[^>]*class=["']([^"']*)["']\s+[^>]*data=["']([^"']*)["']|<label\s+[^>]*data=["']([^"']*)["']\s+[^>]*class=["']([^"']*)["']/g;
                let match;
                
                while ((match = regex.exec(htmlText)) !== null) {
                    let className = match[1] || match[4];
                    let timeKey = match[2] || match[3];

                    // 보이지 않는 특수공백 문자 제거 및 정제
                    if (timeKey) timeKey = timeKey.trim().replace(/[\u00A0\s]/g, "");
                    if (className) className = className.trim();

                    if (masterData[timeKey]) {
                        // 클래스 이름에 'on'이 들어있으면 예약 가능, 'no'이면 예약 마감
                        masterData[timeKey][idx] = {
                            status: className.includes('on') ? "가능" : "완료",
                            url: "http://www.gimposports.or.kr/sub04/sub01.php"
                        };
                    }
                }
            })
            .catch(err => {
                console.error(`${court.label} 데이터 파싱 실패:`, err);
            });
        });

        await Promise.all(fetchPromises);
        renderTable(masterData);
    }

    function renderTable(masterData) {
        const config = siteConfig[currentSite];
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        timeSlots.forEach(slot => {
            const tr = document.createElement('tr');
            
            const tdTime = document.createElement('td');
            tdTime.innerText = slot.name;
            tr.appendChild(tdTime);

            const courtsStatus = masterData[slot.start];
            courtsStatus.forEach((court, index) => {
                const td = document.createElement('td');
                
                if (currentSite === 'solter' && config.courts[index].isDivider) {
                    td.className = "border-divider";
                }
                
                if (court.status === "가능") {
                    td.classList.add("available");
                    td.innerText = "O";
                    td.onclick = () => { window.open(court.url, '_blank'); };
                } else if (court.status === "완료") {
                    td.classList.add("booked");
                    td.innerText = "X";
                } else {
                    td.innerText = "-";
                    td.style.color = "#aaa";
                }
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }
</script>
</body>
</html>
